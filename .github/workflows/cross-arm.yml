name: Arm cross-compilation build
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    name: '${{ matrix.target.arch }}, ${{ matrix.sys.compiler }} ${{ matrix.sys.version }}'
    strategy:
      matrix:
        target:
          - { arch: 'armv7-a', xsimd_arch: 'neon',    dir: 'arm-linux-gnueabihf', flags: '-mfpu=neon', full: 'ON' }
          - { arch: 'armv7-a', xsimd_arch: 'generic', dir: 'arm-linux-gnueabihf', flags: '-mfpu=vfpv3-d16', full: 'OFF' } # no neon
          - { arch: 'armv8-a', xsimd_arch: 'neon64',  dir: 'aarch64-linux-gnu',   flags: '', full: 'ON' }
        sys:
          - { compiler: 'gcc',   version: '10' }
          - { compiler: 'gcc',   version: '14' }
    steps:
    - name: Checkout xsimd
      uses: actions/checkout@v6
    - name: Setup compiler
      id: setup-compiler
      uses: ./.github/actions/setup-cross-compiler-apt
      with:
        compiler: ${{ matrix.sys.compiler }}
        version: ${{ matrix.sys.version }}
        target: ${{ matrix.target.dir }}
        qemu: 'true'
    - name: Setup Ninja
      run: |
        sudo apt-get install ninja-build
    - name: Setup
      run: |
        cmake -B build/ \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_C_FLAGS="-march=${{ matrix.target.arch }} ${{ matrix.target.flags }}" \
            -D CMAKE_CXX_FLAGS="-march=${{ matrix.target.arch }} ${{ matrix.target.flags }}" \
            -D BUILD_TESTS=ON \
            -D DOWNLOAD_DOCTEST=ON \
            -D BUILD_BENCHMARK="${{ matrix.target.full }}" \
            -D BUILD_EXAMPLES="${{ matrix.target.full }}" \
            -D TARGET_ARCH="${{ matrix.target.xsimd_arch }}"
    - name: Build
      run: cmake --build build/ --parallel
    - name: Testing xsimd
      run: ${{ steps.setup-compiler.outputs.qemu }} ./test/test_xsimd
      working-directory: ${{ github.workspace }}/build/
